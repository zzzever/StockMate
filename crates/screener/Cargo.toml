[package]
name = "screener"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
storage = { path = "../storage" }
rust_decimal = { version = "1.35", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
