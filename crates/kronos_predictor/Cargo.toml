[package]
name = "kronos_predictor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
domain = { path = "../domain" }
data_fetcher = { path = "../data_fetcher" }
tauri = { version = "2", features = [] }
chrono = "0.4"

[lib]
name = "kronos_predictor"
path = "src/lib.rs"
